name: Pruebas Robot Framework

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    name: Ejecutar pruebas de Robot Framework
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-browser robotframework-requests robotframework-robocop

      - name: Instalar navegadores de Playwright
        run: rfbrowser init --with-deps

      - name: Analizar calidad con Robocop
        run: python -m robocop check tests resources
        continue-on-error: true

      - name: Ejecutar pruebas
        run: python -m robot --outputdir results --name "Simulacion Credito Hipotecario" tests

      - name: Publicar reporte y evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-robot
          path: results/
          retention-days: 30
